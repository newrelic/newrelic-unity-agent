name: Update Native Agent Versions

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android agent version (leave empty to fetch latest)'
        required: false
        type: string
      ios_version:
        description: 'iOS agent version (leave empty to fetch latest)'
        required: false
        type: string
      ndk_version:
        description: 'Android NDK agent (agent-ndk) version (leave empty to fetch latest)'
        required: false
        type: string
      create_pr:
        description: 'Create PR with new branch (always true for this workflow)'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/update_native_agent.yml'
  schedule:
    # Run weekly on Monday at 9:00 AM UTC to check for updates
    - cron: '0 9 * * 1'

jobs:
  update-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq xmlstarlet

      - name: Fetch latest Android agent version
        id: android_version
        run: |
          if [ -n "${{ inputs.android_version }}" ]; then
            VERSION="${{ inputs.android_version }}"
            echo "Using provided Android version: $VERSION"
          else
            # Fetch latest version from Maven Central metadata
            VERSION=$(curl -s 'https://repo1.maven.org/maven2/com/newrelic/agent/android/android-agent/maven-metadata.xml' | \
              grep '<latest>' | \
              sed 's/.*<latest>\(.*\)<\/latest>.*/\1/')
            echo "Fetched latest Android version: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Fetch latest Android NDK agent version
        id: ndk_version
        run: |
          if [ -n "${{ inputs.ndk_version }}" ]; then
            VERSION="${{ inputs.ndk_version }}"
            echo "Using provided NDK version: $VERSION"
          else
            # agent-ndk is released independently of android-agent — android-agent's
            # POM declares no dependency on it — so its latest version is fetched
            # separately rather than assumed to track the Android agent version.
            VERSION=$(curl -s 'https://repo1.maven.org/maven2/com/newrelic/agent/android/agent-ndk/maven-metadata.xml' | \
              grep '<latest>' | \
              sed 's/.*<latest>\(.*\)<\/latest>.*/\1/')
            echo "Fetched latest NDK version: $VERSION"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine an agent-ndk version. Refusing to continue rather than writing an empty version into TestUnityDependencies.xml."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Fetch latest iOS agent version
        id: ios_version
        run: |
          if [ -n "${{ inputs.ios_version }}" ]; then
            VERSION="${{ inputs.ios_version }}"
            echo "Using provided iOS version: $VERSION"
          else
            # Fetch latest version from CocoaPods using jq to properly parse JSON
            VERSION=$(curl -s 'https://trunk.cocoapods.org/api/v1/pods/NewRelicAgent' | \
              jq -r '.versions[-1].name')
            echo "Fetched latest iOS version: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get current versions
        id: current_versions
        run: |
          # Extract current versions from package.json
          CURRENT_PLUGIN=$(jq -r '.version' package.json)

          # Extract Android version from TestUnityDependencies.xml
          CURRENT_ANDROID=$(xmlstarlet sel -t -v "//androidPackage[contains(@spec, 'android-agent')]/@spec" com.newrelic.agent/Editor/TestUnityDependencies.xml | sed 's/.*:\([0-9.]*\).*/\1/')

          # Extract Android NDK agent version from TestUnityDependencies.xml
          CURRENT_NDK=$(xmlstarlet sel -t -v "//androidPackage[contains(@spec, 'agent-ndk')]/@spec" com.newrelic.agent/Editor/TestUnityDependencies.xml | sed 's/.*:\([0-9.]*\).*/\1/')

          # Extract iOS version from TestUnityDependencies.xml (CocoaPods)
          CURRENT_IOS=$(xmlstarlet sel -t -v "//iosPod[@name='NewRelicAgent']/@version" com.newrelic.agent/Editor/TestUnityDependencies.xml | sed 's/~> //')

          echo "current_android=$CURRENT_ANDROID" >> $GITHUB_OUTPUT
          echo "current_ndk=$CURRENT_NDK" >> $GITHUB_OUTPUT
          echo "current_ios=$CURRENT_IOS" >> $GITHUB_OUTPUT
          echo "current_plugin=$CURRENT_PLUGIN" >> $GITHUB_OUTPUT

          echo "Current Android version: $CURRENT_ANDROID"
          echo "Current Android NDK version: $CURRENT_NDK"
          echo "Current iOS (CocoaPods) version: $CURRENT_IOS"
          echo "Current Plugin version: $CURRENT_PLUGIN"

      - name: Check if updates are needed
        id: check_updates
        run: |
          NEEDS_UPDATE=false
          ANDROID_UPDATED=false
          NDK_UPDATED=false
          IOS_UPDATED=false

          if [ "${{ steps.current_versions.outputs.current_android }}" != "${{ steps.android_version.outputs.version }}" ]; then
            echo "Android version needs update"
            NEEDS_UPDATE=true
            ANDROID_UPDATED=true
          fi

          if [ "${{ steps.current_versions.outputs.current_ndk }}" != "${{ steps.ndk_version.outputs.version }}" ]; then
            echo "Android NDK version needs update"
            NEEDS_UPDATE=true
            NDK_UPDATED=true
          fi

          if [ "${{ steps.current_versions.outputs.current_ios }}" != "${{ steps.ios_version.outputs.version }}" ]; then
            echo "iOS version needs update"
            NEEDS_UPDATE=true
            IOS_UPDATED=true
          fi

          echo "needs_update=$NEEDS_UPDATE" >> $GITHUB_OUTPUT
          echo "android_updated=$ANDROID_UPDATED" >> $GITHUB_OUTPUT
          echo "ndk_updated=$NDK_UPDATED" >> $GITHUB_OUTPUT
          echo "ios_updated=$IOS_UPDATED" >> $GITHUB_OUTPUT

      - name: Calculate new plugin version (patch bump)
        id: new_plugin_version
        if: steps.check_updates.outputs.needs_update == 'true'
        run: |
          CURRENT_VERSION="${{ steps.current_versions.outputs.current_plugin }}"
          echo "Current version: $CURRENT_VERSION"

          # Increment patch version (e.g., 1.4.10 -> 1.4.11)
          major=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          minor=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          patch=$(echo "$CURRENT_VERSION" | cut -d. -f3)

          echo "Parsed - Major: $major, Minor: $minor, Patch: $patch"

          NEW_PATCH=$((patch + 1))
          NEW_VERSION="$major.$minor.$NEW_PATCH"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New plugin version will be: $NEW_VERSION"

      - name: Update package.json
        if: steps.check_updates.outputs.needs_update == 'true'
        run: |
          NEW_VERSION="${{ steps.new_plugin_version.outputs.new_version }}"

          # Update package.json version using jq
          jq --arg version "$NEW_VERSION" \
             '.version = $version' \
             package.json > package-tmp.json && mv package-tmp.json package.json

          echo "Updated package.json to version $NEW_VERSION"

      - name: Update TestUnityDependencies.xml
        if: steps.check_updates.outputs.needs_update == 'true'
        run: |
          ANDROID_VERSION="${{ steps.android_version.outputs.version }}"
          NDK_VERSION="${{ steps.ndk_version.outputs.version }}"
          IOS_VERSION="${{ steps.ios_version.outputs.version }}"

          # Update Android agent version
          xmlstarlet ed -L \
            -u "//androidPackage[contains(@spec, 'android-agent')]/@spec" \
            -v "com.newrelic.agent.android:android-agent:$ANDROID_VERSION" \
            com.newrelic.agent/Editor/TestUnityDependencies.xml

          # Update Android NDK agent version
          xmlstarlet ed -L \
            -u "//androidPackage[contains(@spec, 'agent-ndk')]/@spec" \
            -v "com.newrelic.agent.android:agent-ndk:$NDK_VERSION" \
            com.newrelic.agent/Editor/TestUnityDependencies.xml

          # Update iOS agent version (CocoaPods)
          xmlstarlet ed -L \
            -u "//iosPod[@name='NewRelicAgent']/@version" \
            -v "~> $IOS_VERSION" \
            com.newrelic.agent/Editor/TestUnityDependencies.xml

          echo "Updated TestUnityDependencies.xml"
          echo "Android agent: $ANDROID_VERSION"
          echo "Android NDK agent: $NDK_VERSION"
          echo "iOS agent (CocoaPods): $IOS_VERSION"

      - name: Update native bridge plugin versions
        if: steps.check_updates.outputs.needs_update == 'true'
        run: |
          NEW_VERSION="${{ steps.new_plugin_version.outputs.new_version }}"

          # Android bridge: bump the version string passed to withApplicationFramework
          sed -i "s/agentInstance\.Call<AndroidJavaObject>(\"withApplicationFramework\", platform, \"[0-9.]\+\")/agentInstance.Call<AndroidJavaObject>(\"withApplicationFramework\", platform, \"$NEW_VERSION\")/" com.newrelic.agent/Scripts/Native/NewRelicAndroid.cs
          echo "Updated NewRelicAndroid.cs to version $NEW_VERSION"

          # iOS bridge: bump the version string passed to NR_setPlatform
          sed -i "s/NR_setPlatform(\"[0-9.]\+\")/NR_setPlatform(\"$NEW_VERSION\")/" com.newrelic.agent/Scripts/Native/NewRelicIos.cs
          echo "Updated NewRelicIos.cs to version $NEW_VERSION"

          # Fail loudly if either file still contains the old version — catches
          # drift if someone renames the bridge call without updating this step.
          if grep -q "withApplicationFramework.*\"${{ steps.current_versions.outputs.current_plugin }}\"" com.newrelic.agent/Scripts/Native/NewRelicAndroid.cs; then
            echo "::error::NewRelicAndroid.cs still contains the previous plugin version. Did the bridge call signature change?"
            exit 1
          fi
          if grep -q "NR_setPlatform(\"${{ steps.current_versions.outputs.current_plugin }}\")" com.newrelic.agent/Scripts/Native/NewRelicIos.cs; then
            echo "::error::NewRelicIos.cs still contains the previous plugin version. Did the bridge call signature change?"
            exit 1
          fi

      - name: Update README.md
        if: steps.check_updates.outputs.needs_update == 'true'
        run: |
          ANDROID_VERSION="${{ steps.android_version.outputs.version }}"
          NDK_VERSION="${{ steps.ndk_version.outputs.version }}"

          # Update Android agent version references in README.md
          # Update agent-gradle-plugin reference
          sed -i "s/com.newrelic.agent.android:agent-gradle-plugin:[0-9.]\+/com.newrelic.agent.android:agent-gradle-plugin:$ANDROID_VERSION/" README.md

          # Update android-agent references in dependency examples
          sed -i "s/com.newrelic.agent.android:android-agent:[0-9.]\+/com.newrelic.agent.android:android-agent:$ANDROID_VERSION/" README.md

          # Update agent-ndk references in dependency examples. These had drifted
          # from TestUnityDependencies.xml because this step never managed them.
          sed -i "s/com.newrelic.agent.android:agent-ndk:[0-9.]\+/com.newrelic.agent.android:agent-ndk:$NDK_VERSION/" README.md

          echo "Updated README.md with Android agent version $ANDROID_VERSION and NDK version $NDK_VERSION"

          # The README Gradle snippets must agree with TestUnityDependencies.xml,
          # otherwise users hand-editing their Gradle files pull a different agent
          # than the resolver does.
          XML_ANDROID=$(xmlstarlet sel -t -v "//androidPackage[contains(@spec, 'android-agent')]/@spec" com.newrelic.agent/Editor/TestUnityDependencies.xml | sed 's/.*:\([0-9.]*\).*/\1/')
          XML_NDK=$(xmlstarlet sel -t -v "//androidPackage[contains(@spec, 'agent-ndk')]/@spec" com.newrelic.agent/Editor/TestUnityDependencies.xml | sed 's/.*:\([0-9.]*\).*/\1/')
          for pair in "android-agent:$XML_ANDROID" "agent-ndk:$XML_NDK"; do
            artifact="${pair%%:*}"
            expected="${pair##*:}"
            if grep -q "com\.newrelic\.agent\.android:${artifact}:" README.md && \
               ! grep -q "com\.newrelic\.agent\.android:${artifact}:${expected}" README.md; then
              echo "::error::README.md references ${artifact} at a version other than ${expected} from TestUnityDependencies.xml."
              grep -n "com\.newrelic\.agent\.android:${artifact}:" README.md
              exit 1
            fi
          done
          echo "README.md and TestUnityDependencies.xml agree on Android artifact versions"

      - name: Update CHANGELOG.md
        if: steps.check_updates.outputs.needs_update == 'true'
        run: |
          ANDROID_VERSION="${{ steps.android_version.outputs.version }}"
          NDK_VERSION="${{ steps.ndk_version.outputs.version }}"
          IOS_VERSION="${{ steps.ios_version.outputs.version }}"
          NEW_VERSION="${{ steps.new_plugin_version.outputs.new_version }}"
          ANDROID_UPDATED="${{ steps.check_updates.outputs.android_updated }}"
          NDK_UPDATED="${{ steps.check_updates.outputs.ndk_updated }}"
          IOS_UPDATED="${{ steps.check_updates.outputs.ios_updated }}"

          # Create changelog entry. Each bullet must be a single line:
          # .github/scripts/generate-docs.sh selects them with `grep "^-"` when
          # building the public docs release notes, so wrapped lines are dropped.
          CHANGELOG_ENTRY="## $NEW_VERSION\n\n## Improvements\n"

          if [ "$ANDROID_UPDATED" = "true" ]; then
            CHANGELOG_ENTRY="${CHANGELOG_ENTRY}- Native Android agent updated to version ${ANDROID_VERSION}\n"
          fi

          if [ "$NDK_UPDATED" = "true" ]; then
            CHANGELOG_ENTRY="${CHANGELOG_ENTRY}- Native Android NDK agent updated to version ${NDK_VERSION}\n"
          fi

          if [ "$IOS_UPDATED" = "true" ]; then
            CHANGELOG_ENTRY="${CHANGELOG_ENTRY}- Native iOS agent updated to version ${IOS_VERSION}\n"
          fi

          CHANGELOG_ENTRY="${CHANGELOG_ENTRY}\n"

          # Create temporary file with new entry prepended
          echo -e "$CHANGELOG_ENTRY" | cat - CHANGELOG.md > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

          echo "Updated CHANGELOG.md"

      - name: Create Pull Request
        if: steps.check_updates.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update native agents to v${{ steps.new_plugin_version.outputs.new_version }}"
          branch: "update-native-agents-${{ steps.new_plugin_version.outputs.new_version }}"
          delete-branch: true
          title: "chore: update native agents to v${{ steps.new_plugin_version.outputs.new_version }}"
          body: |
            ## Updates
            - **Android Agent**: ${{ steps.current_versions.outputs.current_android }} → ${{ steps.android_version.outputs.version }}
            - **Android NDK Agent**: ${{ steps.current_versions.outputs.current_ndk }} → ${{ steps.ndk_version.outputs.version }}
            - **iOS Agent (CocoaPods)**: ${{ steps.current_versions.outputs.current_ios }} → ${{ steps.ios_version.outputs.version }}
            - **Plugin Version**: ${{ steps.current_versions.outputs.current_plugin }} → ${{ steps.new_plugin_version.outputs.new_version }}

            ## Testing
            - [ ] Android app builds successfully
            - [ ] iOS app builds successfully via CocoaPods
            - [ ] iOS app launches on a physical device
            - [ ] Manual testing completed
            - [ ] Unity package imports correctly

            ---
            🤖 *Automated PR created by Update Native Agent Versions workflow.*

      - name: Summary
        if: steps.check_updates.outputs.needs_update == 'true'
        run: |
          echo "## Version Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Old Version | New Version |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Android Agent | ${{ steps.current_versions.outputs.current_android }} | ${{ steps.android_version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android NDK Agent | ${{ steps.current_versions.outputs.current_ndk }} | ${{ steps.ndk_version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Agent (CocoaPods) | ${{ steps.current_versions.outputs.current_ios }} | ${{ steps.ios_version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Plugin Version | ${{ steps.current_versions.outputs.current_plugin }} | ${{ steps.new_plugin_version.outputs.new_version }} |" >> $GITHUB_STEP_SUMMARY

      - name: No updates needed
        if: steps.check_updates.outputs.needs_update == 'false'
        run: |
          echo "## No Updates Needed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All native agents are already up to date!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Android Agent: ${{ steps.android_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- iOS Agent: ${{ steps.ios_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY